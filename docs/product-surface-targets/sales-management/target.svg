<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" role="img" aria-labelledby="title desc">
  <title id="title">매지출 관리</title>
  <desc id="desc">금액, 카테고리, 상세, 저장 action이 보인다.</desc>
  <style>
    .frame { fill: #fbfbfa; stroke: #111; stroke-width: 2; }
